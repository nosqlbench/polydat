#
# Multi-platform test matrix for the polydat workspace, in the
# same spirit as the nbrs build workflow this project came from:
# native runners only (no QEMU emulation), pinned runner images,
# pinned action majors, fail-fast disabled so every platform
# reports its own signal.
#
#   test — 4-way matrix, each leg running the workspace test
#     suite twice under nextest, then clippy and rustdoc with warnings as errors
#     under the same two feature sets:
#       default features   — exercises the cranelift JIT, which
#                            emits different machine code per
#                            target arch; this is the reason the
#                            matrix exists at all
#       no-default-features — the interpreter-only path, so a
#                            JIT-less build never silently rots
#
#   all-features — single fast leg on linux/amd64 covering the
#     optional `vectordata` feature (pulls network-stack deps;
#     one platform is enough since the feature is pure Rust and
#     arch-independent, unlike the JIT). Runs the rustfmt check, then
#     clippy and rustdoc with warnings as errors under all features,
#     and the node attribute's compile-fail suite, which is ignored
#     by default.
#
# Platform notes (deltas from the nbrs matrix):
#
# - Windows (`x86_64-pc-windows-msvc`) IS included here. nbrs
#   omits it only because upstream `cassandra-cpp-sys` has no
#   Windows support; polydat is pure Rust (cranelift included),
#   and Windows is a primary dev platform for this project.
#
# - Intel macOS (`x86_64-apple-darwin` / macos-13) is omitted
#   for the same reason as nbrs: GHA's last Intel mac runner
#   pool is heavily contended and queue times routinely exceed
#   an hour. Apple Silicon dominates the macOS install base;
#   Intel users build from source.
#
# Every JS-based action below is pinned to a major version that
# natively targets Node 24. If a bump regresses, pin back to the
# previous major and reopen the upgrade as its own change.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not stop the others — the
      # per-arch JIT signal is the point of the matrix.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14            # Apple Silicon (M-series)
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: polydat-${{ matrix.target }}

      # The suite runs under nextest: one process per test, the test
      # binaries concurrently (.config/nextest.toml). The crates run
      # no doctests; the rustdoc examples are tests of their own.
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Default features = `jit`. This is the run that validates
      # cranelift codegen on each target architecture.
      - name: Test (default features, JIT)
        run: cargo nextest run --workspace --profile ci

      # Interpreter-only path. Shares the same cache key — the
      # feature split changes which deps compile, and rust-cache
      # handles mixed-feature target dirs fine.
      - name: Test (no default features, interpreter only)
        run: cargo nextest run --workspace --no-default-features --profile ci

      # The same two feature sets under clippy and rustdoc, with
      # warnings as errors, on every platform: a lint or a doc link
      # that only breaks on one target fails that leg.
      - name: Clippy (warnings are errors)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: Rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps
          cargo doc --workspace --no-deps --no-default-features

  # The optional `vectordata` feature is pure Rust and
  # arch-independent, so one platform covers it. Kept out of the
  # matrix to avoid multiplying its heavier dependency build
  # (reqwest/rustls stack) across four runners.
  all-features:
    name: all features (linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: polydat-all-features

      # The tree is rustfmt-formatted; a change that is not fails
      # here before anything is built. One platform is enough since
      # formatting is arch-independent.
      - name: Rustfmt (check)
        run: cargo fmt --all --check

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test (all features)
        run: cargo nextest run --workspace --all-features --profile ci

      # Rustdoc is kept warning-free: a broken intra-doc link or a
      # link to a private item fails the build here.
      - name: Rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      # Clippy is kept warning-free across every target, including
      # tests, examples, and benches; the matrix covers the default
      # and interpreter-only feature sets, this leg the full set.
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # Everything above runs in the dev profile, where
      # `debug_assertions` is on. A `#[cfg(debug_assertions)]` on an
      # item a release build still calls compiles here and fails for
      # anyone running `cargo install polydat` or `cargo bench`, which
      # is how the ref-validator's attribute came to sit on the typed
      # accessor beside it and go unnoticed. `--all-targets` covers the
      # benches, where the ladder lives.
      - name: Check release (warnings are errors)
        run: cargo check --release --workspace --all-features --all-targets

      # The node attribute's compile-fail suite is ignored by default
      # because every case is a separate compile; CI always runs it.
      # The integration tests are one binary, `suite`, with each file
      # a module, so the case is addressed by its module path.
      - name: Node attribute diagnostics (trybuild)
        run: "cargo nextest run -p polydat --all-features --test suite --run-ignored ignored-only ui::"
