[alias]
# Release every crate together: `cargo ws-release patch` (or minor,
# major, `custom 0.9.0`); add `--dry-run` to rehearse it. It runs
# `xtask release`, which runs every check CI runs, and the rustdoc
# examples, and only when they all pass runs `cargo ws publish --force
# '*' --all --exact --allow-branch main` with the options given
# (crates/polydat/docs/guides/releasing.md).
ws-release = ["run", "-q", "-p", "xtask", "--", "release"]

# Link with rust-lld, which ships with the toolchain, in place of MSVC
# link.exe: measured 2026-09-12 on the all-features test build (63
# binaries), a cold build went from 880 s to 560 s, relinking every
# binary after a library change from 377 s to 226 s, and one touched
# test file from 22 s to 9 s. The native-code, longjmp, and failure
# attribution tests pass from the lld-linked binaries.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
