[package]
name = "polydat"
# Polydat is published independently of the nbrs workspace —
# its release cadence isn't tied to the workspace's version bump.
# Override `version.workspace = true` with a local pin so polydat
# can rev (e.g., 0.1.1, 0.2.0) without dragging the workspace.
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Polydat — a variates construction engine"
keywords = ["nosqlbench", "workload", "benchmark", "data-generation"]
categories = ["command-line-utilities", "simulation"]
repository = "https://github.com/nosqlbench/polydat"
homepage = "https://github.com/nosqlbench/polydat"
documentation = "https://docs.rs/polydat"
# Local override — `readme.workspace = true` resolves to the
# workspace-root README, not polydat's own. The README that ships
# in the crates.io package needs to be the polydat-specific one.
readme = "README.md"
# The integration tests are one binary, tests/suite.rs, with every
# file under tests/ as a module (one link against the library, not
# one per file); see the suite root for how a test is addressed.
autotests = false

# Exclude bench-output artifacts and large perf-test fixtures from
# the published package. The benches themselves (`benches/`) stay —
# they're part of the public surface — but their generated graphs
# under `tests/bench_graphs/` and the per-test perf fixtures under
# `tests/perf_tests/` are noise for downstream consumers.
exclude = [
    "tests/bench_graphs/**",
    "tests/perf_tests/**",
]

[dependencies]
# SRD-80 — proc-macro derive crate ( `#[polydat_node]` ).
# `inventory` (used for link-time FuncSig registration) is
# already a polydat dep further down — used by the existing
# kernel-tracking infrastructure too.
polydat-derive = { path = "../polydat-derive", version = "0.2.0" }
# The language itself: lexer, parser, AST, comprehension algebra,
# tile template parsers, and the port type vocabulary. Re-exported at
# the paths they always had.
polydat-grammar = { path = "../polydat-grammar", version = "0.2.0" }
# Token-pasting for the macro-generated matrix-completion adapter
# family (`library/polyfill_complete.rs`) — builds `#[polydat_node]`
# fn names like `__u64_to_u8` from type-pair lists so the ~130
# trivial conversion nodes aren't hand-written.
paste = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
data-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Shortest round-trip float digits for tile holes
# (`library::support::float_text`); already a transitive dependency
# through serde_json.
ryu = "1"
vectordata = { version = "1.2", optional = true }
cranelift-jit = { version = "0.116", optional = true }
cranelift-module = { version = "0.116", optional = true }
cranelift-codegen = { version = "0.116", optional = true }
cranelift-frontend = { version = "0.116", optional = true }
cranelift-native = { version = "0.116", optional = true }
inventory = "0.3.24"
# Only the vectordata catalog bridge needs tokio: `block_in_place`
# around its blocking HTTP client when an outer runtime is current
# (`library::vectors::run_blocking_io`), so it rides the feature.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
# Insertion-ordered map. Used by `kernel::ScopeCoord` so the
# coordinate names within a scope appear in clause-declaration
# order — matching the comprehension's source-level intent.
# See `kernel::scope_coords` doc.
indexmap = "2"
# IEEE 754 half-precision float (`f16`). Used by the
# `Value::VecF16` / `PortType::VecF16` carrier so embeddings
# stored as half-precision flow through the kernel without
# widening to f32 at the boundary.
half = "2"
# Command-line harness (`polydat` binary). Optional so library
# consumers who disable default features do not pull it in.
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["jit", "cli"]
cli = ["dep:clap"]
vectordata = ["dep:vectordata", "dep:tokio"]
jit = ["dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-native"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Work-stealing parallelism for tests with uneven per-case cost
# (the §9.2 equivalence harness sweeps random ASTs whose dispense
# time varies widely; rayon's stealing scheduler keeps every core
# fed where fixed chunking leaves stragglers).
rayon = "1"
trybuild = "1.0.121"

[lib]
# The suite runs under nextest, which runs no doctests; the rustdoc
# examples are mirrored in tests/rustdoc_examples.rs and the
# compile-fail seal in tests/ui/seal.
doctest = false

[[bin]]
name = "polydat"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "suite"
path = "tests/suite.rs"

# Each of these defines nodes of its own and so stays a binary of its
# own: a node registers at link time, and the suite's registry-walking
# tests must see the library alone.
[[test]]
name = "ext_tiers"
path = "tests/ext_tiers.rs"

[[test]]
name = "handle_tiers"
path = "tests/handle_tiers.rs"

[[test]]
name = "kernel_api"
path = "tests/kernel_api.rs"

[[test]]
name = "polydat_node_macro"
path = "tests/polydat_node_macro.rs"

[[test]]
name = "srd80b_invariant"
path = "tests/srd80b_invariant.rs"

[[bench]]
name = "polydat_throughput"
harness = false

[[bench]]
name = "cell_throughput"
harness = false

[[bench]]
name = "simd_autopromotion"
harness = false
required-features = ["jit"]

[[bench]]
name = "engine_ladder"
harness = false

[[bench]]
name = "tile_render"
harness = false

# These examples drive the native tier directly, so they need the JIT.
[[example]]
name = "polytile_tutorial"
required-features = ["jit"]

[[example]]
name = "embedding_guide"
required-features = ["jit"]
