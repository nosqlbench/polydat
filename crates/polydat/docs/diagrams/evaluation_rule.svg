<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1180 560" style="max-width:1180px;background-color:white" role="img" aria-label="The one evaluation rule: each step stays current until an input in its provenance changes; a pull runs one cone and eval every step; the interpreter and the compiled kernels realize the same rule">
  <style>
    text { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 14px; fill: #333; }
    .title { font-size: 17px; font-weight: bold; }
    .band { font-size: 13px; fill: #666; letter-spacing: 0.5px; }
    .small { font-size: 12px; fill: #555; }
    .mono { font-family: "Consolas", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .step { stroke: #9370DB; stroke-width: 1.2; }
    .current { fill: #E6F4EA; }
    .stale { fill: #FFF1D6; }
    .constant { fill: #EDEDED; }
    .volatile { fill: #FBE4E4; }
    .input { fill: #ECECFF; stroke: #9370DB; stroke-width: 1.2; }
    .wire { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .prov { stroke: #9370DB; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowp); }
    .pull { stroke: #2E7D32; stroke-width: 1.6; fill: none; marker-end: url(#arrowg); }
    .frame { fill: none; stroke: #BBB; stroke-width: 1; stroke-dasharray: 6 4; }
    .pill { font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9370DB"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
  </defs>

  <text x="24" y="30" class="title">One evaluation rule, on every engine</text>
  <text x="24" y="50" class="small">After one write, in which the host changed only <tspan class="mono">scale</tspan>. A step is current until an input in its provenance changes.</text>

  <!-- Legend -->
  <g transform="translate(600,14)">
    <line x1="0" y1="10" x2="34" y2="10" class="wire"/><text x="42" y="14" class="small">data flow</text>
    <line x1="130" y1="10" x2="164" y2="10" class="prov"/><text x="172" y="14" class="small">provenance</text>
    <line x1="280" y1="10" x2="314" y2="10" class="pull"/><text x="322" y="14" class="small">pull runs</text>
    <rect x="0" y="46" width="14" height="12" class="step current"/><text x="20" y="57" class="small">current</text>
    <rect x="80" y="46" width="14" height="12" class="step stale"/><text x="100" y="57" class="small">not current: runs when pulled</text>
    <rect x="300" y="46" width="14" height="12" class="step constant"/><text x="320" y="57" class="small">folded at build</text>
    <rect x="430" y="46" width="14" height="12" class="step volatile"/><text x="450" y="57" class="small">never current</text>
  </g>

  <!-- Band A: host writes -->
  <rect x="24" y="80" width="230" height="330" class="frame"/>
  <text x="34" y="100" class="band">HOST WRITES</text>
  <rect x="40" y="118" width="196" height="46" rx="6" class="input"/>
  <text x="50" y="137" class="mono">set_inputs([cycle])</text>
  <text x="50" y="155" class="small">coordinate: 7, unchanged</text>
  <rect x="40" y="188" width="196" height="46" rx="6" class="input"/>
  <text x="50" y="207" class="mono">set_input("scale", 1000)</text>
  <text x="50" y="225" class="small">extern: written just now</text>
  <rect x="40" y="258" width="196" height="46" rx="6" class="input"/>
  <text x="50" y="277" class="mono">region</text>
  <text x="50" y="295" class="small">extern, never set: None</text>
  <text x="40" y="340" class="small">A write invalidates the written</text>
  <text x="40" y="356" class="small">input's dependents and nothing else.</text>
  <text x="40" y="372" class="small">No round, epoch, or thread boundary</text>
  <text x="40" y="388" class="small">invalidates anything on its own.</text>

  <!-- Band B: the graph -->
  <rect x="280" y="80" width="576" height="330" class="frame"/>
  <text x="290" y="100" class="band">THE PROGRAM'S STEPS AND THEIR PROVENANCE</text>

  <rect x="300" y="118" width="200" height="52" rx="6" class="step current"/>
  <text x="310" y="138" class="mono">h := hash(cycle)</text>
  <text x="310" y="156" class="pill">prov {cycle} · current</text>
  <rect x="300" y="200" width="200" height="52" rx="6" class="step stale"/>
  <text x="310" y="220" class="mono">id := mod_wire(h, scale)</text>
  <text x="310" y="238" class="pill">prov {cycle, scale} · not current</text>
  <rect x="300" y="282" width="200" height="52" rx="6" class="step stale"/>
  <text x="310" y="302" class="mono">key := "{region}/{id}"</text>
  <text x="310" y="320" class="pill">prov {cycle, scale, region} · not current</text>
  <rect x="650" y="118" width="196" height="52" rx="6" class="step constant"/>
  <text x="660" y="138" class="mono">k := 41 + 1</text>
  <text x="660" y="156" class="pill">folded at build · logged</text>
  <rect x="640" y="200" width="212" height="52" rx="6" class="step volatile"/>
  <text x="648" y="220" class="mono">t := current_epoch_millis()</text>
  <text x="648" y="238" class="pill">nondeterministic · never current</text>
  <rect x="650" y="282" width="196" height="52" rx="6" class="step stale"/>
  <text x="660" y="302" class="mono">row := emit_row(id)</text>
  <text x="660" y="320" class="pill">side channel · observed on run</text>

  <path d="M236,141 L300,141" class="wire"/>
  <path d="M236,211 L300,226" class="wire"/>
  <path d="M236,281 L300,300" class="wire"/>
  <path d="M400,170 L400,200" class="wire"/>
  <path d="M400,252 L400,282" class="wire"/>
  <path d="M500,226 C575,226 575,308 650,308" class="wire"/>

  <path d="M236,150 C280,150 280,230 300,238" class="prov"/>
  <path d="M236,220 C270,220 270,300 300,318" class="prov"/>
  <path d="M236,150 C270,150 270,290 300,292" class="prov"/>

  <text x="300" y="370" class="small">Provenance is the set of inputs whose change makes a step run again. The write to</text>
  <text x="300" y="386" class="small"><tspan class="mono">scale</tspan> reaches <tspan class="mono">id</tspan>, <tspan class="mono">key</tspan>, and <tspan class="mono">row</tspan>; <tspan class="mono">h</tspan> stays current. Compiled kernels record this as a mask per</text>
  <text x="300" y="402" class="small">slot, the interpreter as a dependents list per input; provenance modes choose how much of it to consult.</text>

  <!-- Band C: pulls -->
  <rect x="872" y="80" width="284" height="330" class="frame"/>
  <text x="882" y="100" class="band">WHAT A READ RUNS</text>
  <text x="888" y="128" class="mono">pull("key")</text>
  <text x="888" y="146" class="small">runs id, then key: h is current and</text>
  <text x="888" y="162" class="small">skipped; nothing outside the cone runs</text>
  <path d="M880,128 C868,128 864,138 864,150 L864,340 Q864,346 858,346 L700,346 C600,346 520,336 502,314" class="pull"/>
  <text x="888" y="196" class="mono">pull("k")</text>
  <text x="888" y="214" class="small">runs nothing: the value was folded at</text>
  <text x="888" y="230" class="small">build and is read from its slot</text>
  <text x="888" y="264" class="mono">pull("t")</text>
  <text x="888" y="282" class="small">runs t every time: never current</text>
  <text x="888" y="316" class="mono">eval()</text>
  <text x="888" y="334" class="small">runs every step that is not current;</text>
  <text x="888" y="350" class="small">row fires once and is observed once</text>
  <text x="888" y="384" class="mono">invalidate_all()</text>
  <text x="888" y="402" class="small">nothing current, inputs kept</text>

  <!-- Band E: realizations -->
  <text x="24" y="446" class="band">THE SAME RULE, TWO REALIZATIONS</text>
  <text x="24" y="470" class="small"><tspan font-weight="bold">Interpreter:</tspan> a clean flag per node, a dependents list per input, the nondeterministic nodes always dirty; a write clears its dependents' flags; <tspan class="mono">pull</tspan> walks the cone and re-evaluates what is not clean.</text>
  <text x="24" y="490" class="small"><tspan font-weight="bold">Closure tier and P3:</tspan> a write epoch per step, a provenance mask per slot, a <tspan class="mono">None</tspan> mask; a step ran since the last write when its epoch matches; a coordinate counts as changed only when its value differs.</text>
  <text x="24" y="510" class="small">Both fold compile-constant steps once at build and log them alike; both keep a by-reference output until its inputs change (see the by-reference figure); both report their placements through <tspan class="mono">plan()</tspan>.</text>
  <text x="24" y="534" class="small">Choosing an engine changes how fast the program runs, and nothing on this page.</text>
</svg>
