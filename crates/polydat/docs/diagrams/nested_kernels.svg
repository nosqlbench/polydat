<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1180 620" style="max-width:1180px;background-color:white" role="img" aria-label="Programs and states: one shared program, one state per kernel with its own input and output images; a traversal activation, a tile projection body, and a materialized subcontext are kernels a kernel makes, over their own programs, driven by the same calls, bound from the parent">
  <style>
    text { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 14px; fill: #333; }
    .title { font-size: 17px; font-weight: bold; }
    .band { font-size: 13px; fill: #666; letter-spacing: 0.5px; }
    .small { font-size: 12px; fill: #555; }
    .mono { font-family: "Consolas", "DejaVu Sans Mono", monospace; font-size: 13px; }
    .frame { fill: none; stroke: #BBB; stroke-width: 1; stroke-dasharray: 6 4; }
    .kernel { fill: #FFFFFF; stroke: #9370DB; stroke-width: 1.6; }
    .root { fill: #E6F4EA; stroke: #2E7D32; stroke-width: 1.6; }
    .prog { fill: #EDEDED; stroke: #9370DB; stroke-width: 1; }
    .input { fill: #ECECFF; stroke: #9370DB; stroke-width: 1.2; }
    .cascade { stroke: #B26A00; stroke-width: 1.4; fill: none; stroke-dasharray: 2 3; marker-end: url(#arrowo); }
    .host { stroke: #2E7D32; stroke-width: 1.6; fill: none; marker-end: url(#arrowg); }
    .share { stroke: #9370DB; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .pill { font-size: 11px; }
  </style>
  <defs>
    <marker id="arrowo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B26A00"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
  </defs>

  <text x="24" y="30" class="title">Programs, states, and the kernels a kernel makes</text>
  <text x="24" y="50" class="small">A program is logic and is shared; a state is the register image a kernel runs the program over. Every kernel, wherever it came from, is a program plus a state of its own.</text>

  <!-- Program, shared -->
  <rect x="24" y="72" width="216" height="150" rx="8" class="prog"/>
  <text x="34" y="92" class="band">PROGRAM, SHARED</text>
  <text x="34" y="112" class="small">compiled once, read-only,</text>
  <text x="34" y="128" class="small">one <tspan class="mono">Arc</tspan> for every fiber</text>
  <text x="34" y="156" class="mono">base := hash(cycle)</text>
  <text x="34" y="174" class="mono">id := mod_wire(base, scale)</text>
  <text x="34" y="192" class="mono">for k in 1..4 { y := k*10+id }</text>
  <text x="34" y="210" class="mono">tile t := "@for g in list {${g}}"</text>

  <!-- Two states -->
  <rect x="290" y="72" width="410" height="150" rx="8" class="root"/>
  <text x="302" y="92" class="band">STATE, FIBER A · driven by its host</text>
  <rect x="302" y="104" width="186" height="50" rx="5" class="input"/>
  <text x="310" y="122" class="mono">input image</text>
  <text x="310" y="140" class="pill">coordinates, externs, cursors: last written</text>
  <rect x="502" y="104" width="186" height="50" rx="5" class="input"/>
  <text x="510" y="122" class="mono">output image</text>
  <text x="510" y="140" class="pill">every step's slots and its own scratch</text>
  <text x="302" y="178" class="small">currency: a clean flag or a write epoch per step; a step's output stands until an</text>
  <text x="302" y="194" class="small">input in its provenance is written. The rules of §3.1 hold here as if this kernel</text>
  <text x="302" y="210" class="small">were the only one in the process.</text>

  <rect x="740" y="72" width="416" height="150" rx="8" class="root"/>
  <text x="752" y="92" class="band">STATE, FIBER B · the same program</text>
  <rect x="752" y="104" width="186" height="50" rx="5" class="input"/>
  <text x="760" y="122" class="mono">input image</text>
  <text x="760" y="140" class="pill">its own</text>
  <rect x="952" y="104" width="190" height="50" rx="5" class="input"/>
  <text x="960" y="122" class="mono">output image</text>
  <text x="960" y="140" class="pill">its own</text>
  <text x="752" y="178" class="small">Two states of one program never share a buffer; a <tspan class="mono">shared</tspan> binding is a cell</text>
  <text x="752" y="194" class="small">both attach to. A read from either state is an owned copy: no API returns a</text>
  <text x="752" y="210" class="small">borrow into a state.</text>

  <path d="M240,147 L290,147" class="share"/>
  <path d="M240,147 C260,147 260,60 740,60 L740,72" class="share"/>

  <!-- Kernels a kernel makes -->
  <rect x="24" y="250" width="1132" height="250" class="frame"/>
  <text x="34" y="270" class="band">KERNELS A KERNEL MAKES · each a program plus a state of its own, driven by the same calls</text>

  <rect x="40" y="288" width="350" height="196" rx="8" class="kernel"/>
  <text x="52" y="308" class="band">TRAVERSAL ACTIVATION</text>
  <text x="52" y="326" class="small">one kernel per tuple of a <tspan class="mono">for</tspan>; the host opens</text>
  <text x="52" y="342" class="small">them with <tspan class="mono">traverse(i)</tspan> and drives each itself</text>
  <rect x="52" y="352" width="326" height="40" rx="5" class="prog"/>
  <text x="60" y="369" class="mono">body program: y := k * 10 + id</text>
  <text x="60" y="385" class="pill">one program per engine per lexical position</text>
  <rect x="52" y="400" width="156" height="40" rx="5" class="input"/>
  <text x="60" y="417" class="mono">k := 2</text>
  <text x="60" y="433" class="pill">element: the tuple's own</text>
  <rect x="222" y="400" width="156" height="40" rx="5" class="input"/>
  <text x="230" y="417" class="mono">id</text>
  <text x="230" y="433" class="pill">cascade, as at open</text>
  <text x="52" y="466" class="small">lives while the host holds the activation;</text>
  <text x="52" y="480" class="small">its own <tspan class="mono">for</tspan> opens from it the same way</text>

  <rect x="414" y="288" width="350" height="196" rx="8" class="kernel"/>
  <text x="426" y="308" class="band">TILE PROJECTION BODY</text>
  <text x="426" y="326" class="small">one kernel per body program and engine, owned by</text>
  <text x="426" y="342" class="small">the rendering state in the render step's scratch</text>
  <rect x="426" y="352" width="326" height="40" rx="5" class="prog"/>
  <text x="434" y="369" class="mono">body program: ${g} over the tuple</text>
  <text x="434" y="385" class="pill">precompiled on the default engine at construction</text>
  <rect x="426" y="400" width="156" height="40" rx="5" class="input"/>
  <text x="434" y="417" class="mono">g</text>
  <text x="434" y="433" class="pill">element, bound by index</text>
  <rect x="596" y="400" width="156" height="40" rx="5" class="input"/>
  <text x="604" y="417" class="mono">cycle, list</text>
  <text x="604" y="433" class="pill">cascade: the render's inputs</text>
  <text x="426" y="466" class="small">re-bound per tuple, reused across the state's</text>
  <text x="426" y="480" class="small">renders; the host never sees it</text>

  <rect x="788" y="288" width="350" height="196" rx="8" class="kernel"/>
  <text x="800" y="308" class="band">MATERIALIZED SUBCONTEXT</text>
  <text x="800" y="326" class="small">a host-composed child with a contract, built</text>
  <text x="800" y="342" class="small">against the parent with new program matter</text>
  <rect x="800" y="352" width="326" height="40" rx="5" class="prog"/>
  <text x="808" y="369" class="mono">child program</text>
  <text x="808" y="385" class="pill">interpreter only, today</text>
  <rect x="800" y="400" width="156" height="40" rx="5" class="input"/>
  <text x="808" y="417" class="mono">consts, externs</text>
  <text x="808" y="433" class="pill">value-copied at open</text>
  <rect x="970" y="400" width="156" height="40" rx="5" class="input"/>
  <text x="978" y="417" class="mono">shared bindings</text>
  <text x="978" y="433" class="pill">bound to the parent's cells</text>
  <text x="800" y="466" class="small">lives while the host holds it; its cells are the</text>
  <text x="800" y="480" class="small">parent's, so a write on either side is seen by both</text>

  <path d="M400,222 C400,250 300,258 300,288" class="cascade"/>
  <path d="M520,222 C520,250 674,258 674,288" class="cascade"/>
  <path x="0" d="M640,222 C640,250 1048,258 1048,288" class="cascade"/>

  <text x="24" y="530" class="band">WHAT THIS MEANS IN PRACTICE</text>
  <text x="24" y="552" class="small">Constructing any of these, and compiling any program, writes nothing in any other state: there is no shared arena, table, or counter that a kernel's existence touches.</text>
  <text x="24" y="570" class="small">Its inputs come from the parent (elements, the cascade, cells for shared bindings), never from the host directly; a value it produces stands until one of those inputs is</text>
  <text x="24" y="588" class="small">written again. It has the same <tspan class="mono">Kernel</tspan> surface as any other: <tspan class="mono">set_inputs</tspan>, <tspan class="mono">pull</tspan>, <tspan class="mono">traverse</tspan>. A host never builds one; the root builds them when the host traverses or a tile renders.</text>
</svg>
