[workspace]
members = [
    "crates/polydat",
    "crates/polydat-grammar",
    "crates/polydat-core",
    "crates/polydat-nodes",
    "crates/polydat-derive",
]
resolver = "3"

[workspace.package]
# The version every crate in the tree inherits. A release publishes
# only the crates that changed, at this version, so a crate a release
# does not publish stays at the version it last shipped at. What a
# host resolves is set by the requirements under
# [workspace.dependencies], which name the newest published version
# of each crate (crates/polydat/docs/guides/releasing.md).
version = "0.5.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nosqlbench/polydat"
homepage = "https://github.com/nosqlbench/polydat"

# The internal crates, declared once so every dependency edge names
# the same path and the same published version. The runtime and the
# node library are declared without their default features: every
# crate that links them chooses the feature set (`jit` rides the
# facade's own feature), and cargo does not let a member switch a
# workspace dependency's defaults off at the edge.
#
# Each requirement names the newest published version of that crate,
# and a release raises it for every crate it publishes (see
# crates/polydat/docs/guides/releasing.md). A requirement left at an
# older version lets a host's lockfile keep that older crate under a
# newer facade, without the fixes the facade was released with.
[workspace.dependencies]
polydat-derive = { path = "crates/polydat-derive", version = "0.5.0" }
polydat-grammar = { path = "crates/polydat-grammar", version = "0.5.0" }
polydat-core = { path = "crates/polydat-core", version = "0.5.3", default-features = false }
polydat-nodes = { path = "crates/polydat-nodes", version = "0.5.1", default-features = false }

[profile.release]
lto = "thin"
